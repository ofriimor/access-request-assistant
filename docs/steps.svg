<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" width="1000" height="664" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<style>
.k{font-size:10.5px;font-weight:700;fill:#57606a;letter-spacing:.12em}
.ttl{font-size:19px;font-weight:700;fill:#24292f}
.nm{font-size:15px;font-weight:700;fill:#24292f}
.wh{font-size:13.5px;font-weight:600;fill:#24292f}
.hw{font-size:12px;fill:#57606a}
.mo{font-size:12px;fill:#57606a;font-family:ui-monospace,"SF Mono",Consolas,monospace}
.cn{font-size:12.5px;font-weight:700;fill:#fff}
.ch{font-size:9.5px;font-weight:700;letter-spacing:.1em}
.lb{font-size:11px;fill:#57606a}
.stt{font-size:12px;font-weight:700;fill:#24292f}
.sr{font-size:12px;fill:#57606a}
</style>
<rect width="1000" height="664" fill="#fff"/>
<rect x="20" y="16" width="4" height="40" fill="#c9241f"/>
<text class="k" x="36" y="29">ACCESS REQUEST ASSISTANT</text>
<text class="ttl" x="36" y="52">The 7 steps</text>
<text class="k" x="290" y="76">WHAT IT DOES</text><text class="k" x="730" y="76">FILES · TOOLS</text>
<rect x="20" y="84" width="960" height="66" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="150" x2="52" y2="162" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="52" cy="117.0" r="14" fill="#24292f"/><text class="cn" x="52" y="121.5" text-anchor="middle">1</text>
<text class="nm" x="80" y="122.0">Intake</text>
<text class="wh" x="290" y="112">Accepts the request and gives it an ID</text><text class="hw" x="290" y="131">Every field validated · ID = hash of the content, so a repeat is caught</text>
<line x1="712" y1="98" x2="712" y2="136" stroke="#d0d7de"/>
<text class="mo" x="730" y="112">schemas.py · engine.py</text><text class="mo" x="730" y="131">state.py → state.db</text>
<rect x="20" y="162" width="960" height="66" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="228" x2="52" y2="240" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="52" cy="195.0" r="14" fill="#24292f"/><text class="cn" x="52" y="199.5" text-anchor="middle">2</text>
<text class="nm" x="80" y="191">Understand</text>
<rect x="80" y="200" width="35.6" height="17" rx="3" fill="#fff" stroke="#57606a" stroke-width=".9"/><text class="ch" x="87" y="212" fill="#57606a">LLM</text>
<text class="wh" x="290" y="190">Turns free text into structured fields</text><text class="hw" x="290" y="209">Gemini returns system, level, days and reason as checked JSON</text>
<line x1="712" y1="176" x2="712" y2="214" stroke="#d0d7de"/>
<text class="mo" x="730" y="190">llm.py → Gemini API</text><text class="mo" x="730" y="209">schemas.py · guard.py</text>
<rect x="20" y="240" width="960" height="66" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="306" x2="52" y2="318" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="52" cy="273.0" r="14" fill="#24292f"/><text class="cn" x="52" y="277.5" text-anchor="middle">3</text>
<text class="nm" x="80" y="278.0">Retrieve</text>
<text class="wh" x="290" y="268">Collects the policy and the people</text><text class="hw" x="290" y="287">TF-IDF search + exact policy read · employee, requester, manager</text>
<line x1="712" y1="254" x2="712" y2="292" stroke="#d0d7de"/>
<text class="mo" x="730" y="268">search_policies · read_policy</text><text class="mo" x="730" y="287">lookup_user</text>
<rect x="20" y="318" width="960" height="66" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="384" x2="52" y2="396" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="52" cy="351.0" r="14" fill="#24292f"/><text class="cn" x="52" y="355.5" text-anchor="middle">4</text>
<text class="nm" x="80" y="356.0">Decide</text>
<text class="wh" x="290" y="346">Rules decide — never the model</text><text class="hw" x="290" y="365">Allowed, blocked or missing info · duration capped · plan + plan_hash</text>
<line x1="712" y1="332" x2="712" y2="370" stroke="#d0d7de"/>
<text class="mo" x="730" y="346">guard.py</text><text class="mo" x="730" y="365">engine.py</text>
<rect x="20" y="396" width="960" height="66" rx="8" fill="#fff" stroke="#c9241f" stroke-width="1.5"/>
<line x1="52" y1="462" x2="52" y2="474" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="52" cy="429.0" r="14" fill="#c9241f"/><text class="cn" x="52" y="433.5" text-anchor="middle">5</text>
<text class="nm" x="80" y="425">Approve</text>
<rect x="80" y="434" width="50.0" height="17" rx="3" fill="#c9241f"/><text class="ch" x="87" y="446" fill="#fff">HUMAN</text>
<text class="wh" x="290" y="424">Stops until the right manager decides</text><text class="hw" x="290" y="443">Direct manager, or theirs · never the requester · bound to plan_hash</text>
<line x1="712" y1="410" x2="712" y2="448" stroke="#d0d7de"/>
<text class="mo" x="730" y="424">approve · reject</text><text class="mo" x="730" y="443">engine.py · state.py</text>
<rect x="20" y="474" width="960" height="66" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<line x1="52" y1="540" x2="52" y2="552" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="52" cy="507.0" r="14" fill="#24292f"/><text class="cn" x="52" y="511.5" text-anchor="middle">6</text>
<text class="nm" x="80" y="503">Execute</text>
<rect x="80" y="512" width="50.0" height="17" rx="3" fill="#fff" stroke="#57606a" stroke-width=".9"/><text class="ch" x="87" y="524" fill="#57606a">WRITE</text>
<text class="wh" x="290" y="502">Grants the access, exactly once</text><text class="hw" x="290" y="521">Same plan? Rules re-checked on fresh data · idempotency key · retries</text>
<line x1="712" y1="488" x2="712" y2="526" stroke="#d0d7de"/>
<text class="mo" x="730" y="502">grant_access</text><text class="mo" x="730" y="521">engine.py · guard.py</text>
<rect x="20" y="552" width="960" height="66" rx="8" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<circle cx="52" cy="585.0" r="14" fill="#24292f"/><text class="cn" x="52" y="589.5" text-anchor="middle">7</text>
<text class="nm" x="80" y="590.0">Verify &amp; Report</text>
<text class="wh" x="290" y="580">Proves it happened and records it</text><text class="hw" x="290" y="599">Directory read again (5 checks) · every step audited · As-Built HTML</text>
<line x1="712" y1="566" x2="712" y2="604" stroke="#d0d7de"/>
<text class="mo" x="730" y="580">lookup_user</text><text class="mo" x="730" y="599">audit.py · report.py</text>
<text class="hw" x="20" y="650">Every tool call goes through the tool gateway in engine.py: allow-list · input/output schema · bounded retry · audit.</text>
</svg>